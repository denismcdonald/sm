<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharal & Beyond · The Party’s World Guide</title>
<meta name="description" content="Dale’s campaign world: the map, towns, regions and rumours of Sharal and beyond.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231e303c'/%3E%3Cpath d='M16 4l4 12-4 12-4-12z' fill='%23d6b575'/%3E%3Cpath d='M4 16l12-4 12 4-12 4z' fill='%23f8f5ed'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#25343b;--blue:#1e303c;--gold:#a57d39;--paper:#faf8f2;--line:#d9d7cc;--muted:#56626a}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:1.5rem}body{margin:0;background:var(--paper);color:var(--ink);font:1.125rem/1.8 Georgia,'Times New Roman',serif}a{color:inherit;text-underline-offset:.22em}button{font:inherit;color:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #ad771e;outline-offset:5px}button:hover,a:hover{color:#80591d}.skip{position:absolute;left:1rem;top:-5rem;background:white;padding:.5rem 1rem;z-index:5}.skip:focus{top:1rem}
header{background:var(--blue);color:#fbf8f0;border-top:4px solid #b49152;padding:2.5rem 2rem 2.3rem;position:relative}header .inner{max-width:1120px;margin:auto}.eyebrow{font: .8rem/1.5 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#d7bd89;margin:0 0 .65rem}h1{font-size:clamp(2.5rem,6vw,4rem);font-weight:400;letter-spacing:-.035em;line-height:1.15;margin:0}header .byline{font-size:1rem;color:#c6ced0;margin:.8rem 0 0}.ornament{float:right;color:#d7bd89;font-size:3.7rem;font-weight:400;line-height:1.4;margin-left:1rem}
.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:3.5rem;max-width:1184px;padding:2.75rem 2rem 3rem;margin:auto}aside{align-self:start;position:sticky;top:1.5rem}nav h2{font: .8rem/1.4 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.15em;margin:0 0 1rem;color:var(--muted)}nav a{display:flex;align-items:baseline;gap:.9rem;text-decoration:none;padding:.42rem .5rem;border-left:2px solid transparent;font-size:1rem}nav a span{font:.75rem system-ui,sans-serif;color:#77745e;font-variant-numeric:tabular-nums}nav a:hover,nav a[aria-current="location"]{background:#efeee6;border-left-color:var(--gold);color:var(--ink)}main{min-width:0}section{margin-bottom:3.5rem;scroll-margin-top:1.5rem}.section-heading{display:flex;align-items:baseline;gap:.9rem;border-bottom:1px solid var(--line);padding-bottom:.8rem;margin-bottom:1.65rem}.number{font:.8rem system-ui,sans-serif;color:#886c37}h2{font-size:2.15rem;font-weight:400;line-height:1.25;letter-spacing:-.02em;margin:0}h3,h4,h5,h6{font-weight:400;line-height:1.4}.back{margin-left:auto;flex-shrink:0;font:.8rem system-ui,sans-serif;color:var(--muted);text-decoration:none}.prose{max-width:70ch}.prose p{margin:0 0 1.25em}.prose p:first-child::first-letter{font-size:2.5em;line-height:1;float:left;padding:.12em .12em 0 0;color:#805e2c}figure{margin:0}.map-open{display:block;width:100%;padding:0;border:1px solid #b9b29f;background:#e8e0ca;line-height:0;box-shadow:0 5px 17px #23343d12;cursor:zoom-in}.map-open img{display:block;width:100%;height:auto}figcaption{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font:.85rem/1.5 system-ui,sans-serif;color:var(--muted);padding-top:.8rem}.map-actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.text-button{font:inherit;border:0;padding:0;background:none;text-decoration:underline;text-underline-offset:3px}footer{max-width:1120px;margin:0 auto;padding:1.5rem 0 2.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;font:.85rem/1.5 system-ui,sans-serif;color:var(--muted)}dialog{width:96vw;max-width:1700px;height:94vh;max-height:94vh;padding:0;border:1px solid #b5a379;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#101c24db}.dialog-bar{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;gap:1rem;font:.95rem system-ui,sans-serif;border-bottom:1px solid var(--line)}.dialog-bar button{padding:.5rem .9rem;border:1px solid #8d938d;background:transparent;border-radius:3px}.map-scroll{height:calc(100% - 75px);overflow:auto;background:#e2dccd}.map-scroll img{display:block;width:1600px;max-width:none;height:auto}
@media(min-width:1000px){#map{margin-bottom:3rem}}
@media(max-width:760px){header{padding:1.7rem 1.25rem}.ornament{font-size:2.7rem}.layout{display:block;padding:1.75rem 1.25rem}aside{position:static;margin-bottom:2.5rem}nav .links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.2rem}nav a{font-size:.95rem;padding:.4rem .25rem;gap:.4rem}nav a span{display:none}h2{font-size:1.85rem}section{margin-bottom:2.5rem}footer{margin:0 1.25rem;gap:1rem}body{font-size:1.0625rem}.section-heading{gap:.55rem}.back{font-size:.75rem}figcaption{font-size:.8rem}}
@media(max-width:360px){nav .links{grid-template-columns:repeat(2,minmax(0,1fr))}.ornament{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{body{background:white;font-size:11pt}header{background:white;color:black;padding:0 0 1rem;border:0}.eyebrow,header .byline{color:#333}.ornament,aside,.back,.text-button,dialog,footer{display:none}.layout{display:block;padding:1rem 0}.section-heading{break-after:avoid}section{margin-bottom:2rem}.map-open{box-shadow:none}a{text-decoration:none}}
</style>
</head>
<body id="top">
<h1 class="visually-hidden">Sharal &amp; Beyond · World guide</h1>
<a class="skip" href="#main">Skip to world guide</a>
<div class="layout"><aside><nav id="contents" aria-label="Contents"><h2>In this guide</h2><div class="links">{{CONTENTS}}</div></nav></aside><main id="main">{{SECTIONS}}</main></div>
<footer><span>Campaign notes by Dale</span><a href="#top">Back to top ↑</a></footer>
<dialog aria-label="Dale’s world map"><div class="dialog-bar"><span>World map · Scroll to explore</span><span class="map-actions"><button class="map-toggle" onclick="toggleMap()" aria-pressed="false">Original photo</button><button autofocus onclick="this.closest('dialog').close()">Close</button></span></div><div class="map-scroll"><img src="{{MAP}}" width="1600" height="1200" alt="Full-size hand-drawn map of Sharal and surrounding lands."></div></dialog>
<script>
const defaultMap=document.querySelector('.map-open img').src;
const originalMap="{{ORIGINAL}}";
let showingOriginal=false;
function toggleMap(){
  showingOriginal=!showingOriginal;
  for(const img of document.querySelectorAll('.map-open img, .map-scroll img'))img.src=showingOriginal?originalMap:defaultMap;
  for(const button of document.querySelectorAll('.map-toggle')){
    button.textContent=showingOriginal?'Back to map':'Original photo';
    button.setAttribute('aria-pressed',String(showingOriginal));
  }
}

function showMap(){const d=document.querySelector("dialog");d.showModal();d.querySelector(".map-scroll").scrollTo(0,0)}
const sections=[...document.querySelectorAll('main section')];
const links=[...document.querySelectorAll('nav a')];
let queued=false;
function markSection(){
  const atBottom=window.scrollY>0 && Math.ceil(window.scrollY+window.innerHeight)>=document.documentElement.scrollHeight-3;
  const current=atBottom?sections[sections.length-1]:(sections.filter(s=>s.getBoundingClientRect().top<=150).pop()||sections[0]);
  for(const a of links){
    if(a.hash==='#'+current.id)a.setAttribute('aria-current','location');
    else a.removeAttribute('aria-current');
  }
  queued=false;
}
function scheduleMark(){if(!queued){queued=true;requestAnimationFrame(markSection)}}
addEventListener('scroll',scheduleMark,{passive:true});
addEventListener('resize',scheduleMark);
markSection();
</script>
</body></html>
